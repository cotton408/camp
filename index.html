<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 세계관 보관소</title>
    <style>
        body {
            background-color: #fcf9f2; /* 따뜻하고 포근한 배경색 */
            color: #5c4b41;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            /* 크레용이나 손그림 느낌을 주는 점선 테두리 */
            border: 4px dashed #ffd700; 
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }
        h1 {
            color: #d18b77;
        }
        .highlight {
            font-weight: bold;
            color: #d18b77;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>환영합니다! 🧸</h1>
        <p>이곳은 <span class="highlight">캐릭터 설정</span>과 이야기들을 기록하는 공간입니다.</p>
        <p>앞으로 다양한 세계관과 에피소드를 채워나갈 예정이에요.</p>
    </div>
</body>
</html>
